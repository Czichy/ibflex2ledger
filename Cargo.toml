[package]
name = "flex-web-rs"
version = "0.1.0"
authors = ["Christian Czichy <christian@czichy.com>"]
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
