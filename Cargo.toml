[package]
name = "flex-web-rs"
version = "0.1.0"
authors = ["Christian Czichy <christian@czichy.com>"]
edition = "2018"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.7"
futures = "0.1"
bytes = "0.4"
reqwest = "0.9"
tokio = { version = "0.1.7", default-features = false, features = ["rt-full", "tcp"] }
regex = "1"
serde = "1.0"
serde-xml-rs = "0.3.1"
tempfile="3.1"
serde_urlencoded = "0.5"
log = "0.4.6"
futures-core-preview = "=0.3.0-alpha.19"
futures-util-preview = { version = "=0.3.0-alpha.19", default-features = false }
roxmltree = "0.7.1"
